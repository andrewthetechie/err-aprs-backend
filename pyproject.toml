[project]
name = "err-aprs-backend"
version = "0.5.1"
description = "Errbot APRS backend plugin"
authors = [{ name = "Andrew Herrington", email = "andrew.the.techie@gmail.com" }]
requires-python = ">=3.13,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aprslib>=0.7.2,<0.8",
    "expiringdict>=1.2.2,<2",
    "dataclasses-json>=0.6.4,<0.7",
    "better-profanity>=0.7.0,<0.8",
    "httpx>=0.27.0,<0.28",
]

[project.entry-points."errbot.backend_plugins"]
aprs = "aprs_backend:APRSBackend"

[project.entry-points."errbot.plugins"]
help = "aprs_backend:APRSHelp"

[dependency-groups]
dev = [
    "pytest>=8.1.1,<9",
    "coverage[toml]>=6.5,<8.0",
    "pre-commit>=2.12.1",
    "pep8-naming>=0.13.2,<0.16.0",
    "reorder-python-imports>=3.9.0,<4",
    "pre-commit-hooks>=4.2,<6.0",
    "pyupgrade>=3.15.2,<4",
    "pytest-xdist>=3.1.0,<4",
    "ruff>=0.5.1,<0.14.6",
    "bandit>=1.7.8,<2",
    "pytest-subtests>=0.12.1,<0.16.0",
    "pytest-cov>=5,<8",
    "pytest-asyncio>=0.23.6,<1.5.0",
    "pytest-httpx>=0.30,<0.35",
    "errbot>=6.2.0",
    "nox>=2025.2.9",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["aprs_backend"]
module-root = ""
source-include = ["*.plug"]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.bandit]
exclude_dirs = ["tests", "noxfile.py", ".github/scripts", "test_errbot", "dist"]

[tool.errbot.backend_plugins]
supported_errbot_version = ">=6.2.0"


[tool.pytest.ini_options]
norecursedirs = ".github ci .git .idea"
addopts = "-n auto --cov=aprs_backend --cov-report xml:.coverage.xml --cov-report=term-missing"
